<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="個人作品集、文章與經歷" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- 字體：手寫感標題、內文、英文標題、等寬（見 tailwind.config.js 的 fontFamily） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Schibsted+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!-- 在載入樣式前套用使用者選擇的深淺色，避免閃爍（與 src/composables/useColorScheme.ts 使用同一個 key） -->
    <script>
      try {
        var t = localStorage.getItem('pm-color-scheme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>

    <title>Personal Manager</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>此網站需要啟用 JavaScript。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
