name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build
        run: dotnet build PersonalManager.sln --configuration Release
      - name: Test
        run: dotnet test PersonalManager.sln --configuration Release --no-build
      # 每次 schema 異動都要同時產生 Sqlite 與 MySql 兩組 migration（ADR-008），漏掉任一組就讓 CI 失敗
      - name: Check migrations are up to date
        working-directory: backend/src/PersonalManager.Api
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --context SqliteApplicationDbContext
          dotnet ef migrations has-pending-model-changes --context MySqlApplicationDbContext

  frontend:
    name: Frontend (lint + type-check + unit test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit test
        run: npx vitest run
      - name: Type-check + build
        run: npm run build
